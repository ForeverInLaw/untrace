name: CI
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: untrace
    steps:
      # Path dependencies expect lethe beside untrace.
      - uses: actions/checkout@v4
        with:
          path: untrace
      # A pull request builds against the lethe branch of the same name when there
      # is one, so a change made across both repos passes before lethe is merged.
      - name: Pick the lethe branch
        id: lethe
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads https://github.com/ForeverInLaw/lethe "refs/heads/$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: ForeverInLaw/lethe
          ref: ${{ steps.lethe.outputs.ref }}
          path: lethe
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
          version: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: untrace/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: untrace
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check Telegram bridge
        run: cargo check -p untrace --features telegram-tdlib-docs --locked
