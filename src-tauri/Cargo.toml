[package]
name = "untrace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "untrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
telegram-tdlib-docs = ["dep:tdlib-rs", "lethe-telegram/tdlib-docs", "tdlib-rs/docs"]
telegram-tdlib-local = ["dep:tdlib-rs", "lethe-telegram/tdlib-local", "tdlib-rs/local-tdlib"]
telegram-tdlib-download = ["dep:tdlib-rs", "lethe-telegram/tdlib-download", "tdlib-rs/download-tdlib"]
telegram-tdlib-static = ["lethe-telegram/tdlib-static"]

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
keyring.workspace = true
time = "0.3"

lethe-adapter.workspace = true
lethe-net.workspace = true
lethe-core.workspace = true
lethe-store.workspace = true
lethe-crypto.workspace = true
lethe-bluesky.workspace = true
lethe-telegram.workspace = true
tdlib-rs = { version = "1.4.0", optional = true, default-features = false }
fs4 = { version = "1.1.0", features = ["sync"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

